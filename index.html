<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Test tuzish va tekshirish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* VOICE: botdagi rasmdagidek — tinch, to'q, ixcham ilova
   IDEA: o'qituvchining test daftari — sonlar kartochkada, ishlar ro'yxatda
   PICTURE: 2x2 son kartochkalari, burchakda yumaloq dog'
   COLOUR and TYPE: binafsha-ko'k gradiyent fon, yumshoq nurlar; yorug'/qorong'i rejim; Nunito
   LAYOUT: bitta ustun, pastda 4 bo'limli navigatsiya */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
:root{--bg:#1f2633;--bg2:#2a2347;--card:rgba(50,60,76,.72);--line:rgba(160,172,196,.35);--ink:#f3f5f8;--mute:#aab4c2;
  --acc:#8b6cf0;--blob:rgba(139,108,240,.28);--icon:#d9ccff;--nav:rgba(36,43,56,.82);--navon:rgba(139,108,240,.22);
  --glow1:rgba(139,108,240,.45);--glow2:rgba(56,189,248,.28);--glow3:rgba(236,72,153,.22);--dots:rgba(255,255,255,.05)}
:root[data-theme=light]{--bg:#f4f1ff;--bg2:#e6f3ff;--card:rgba(255,255,255,.78);--line:rgba(110,90,200,.22);--ink:#1e1b33;--mute:#676282;
  --acc:#7353e6;--blob:rgba(115,83,230,.14);--icon:#6a4be0;--nav:rgba(255,255,255,.85);--navon:rgba(115,83,230,.13);
  --glow1:rgba(139,108,240,.35);--glow2:rgba(56,189,248,.3);--glow3:rgba(244,114,182,.25);--dots:rgba(60,40,140,.06)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;transition:background .3s,color .3s}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dots) 1.2px,transparent 1.3px);background-size:22px 22px}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);animation:drift 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:320px;height:320px;background:var(--glow1);top:-90px;right:-80px}
.bgfx i:nth-child(2){width:260px;height:260px;background:var(--glow2);bottom:12%;left:-110px;animation-delay:-6s}
.bgfx i:nth-child(3){width:220px;height:220px;background:var(--glow3);bottom:-80px;right:-40px;animation-delay:-12s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.12)}}
.stat,.item,.note{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.theme{flex:none;width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.theme svg{width:22px;height:22px;stroke:var(--icon);fill:none;stroke-width:2;stroke-linecap:round}
.theme .sun{display:none}:root[data-theme=light] .theme .sun{display:block}:root[data-theme=light] .theme .moon{display:none}
main{max-width:560px;margin:0 auto;padding:22px 14px 110px}
h1{font-size:26px;font-weight:900;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
h1 svg{width:28px;height:28px}
.hello{color:var(--mute);font-size:14px;margin:-8px 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:18px;padding:16px 14px 14px;background:var(--card);min-height:86px}
.stat::after{content:"";position:absolute;right:-18px;top:-22px;width:68px;height:68px;border-radius:50%;background:var(--blob)}
.stat b{display:block;font-size:24px;font-weight:900;position:relative;z-index:1}
.stat span{font-size:13px;color:var(--mute);font-weight:700;position:relative;z-index:1}
.sec{font-size:15px;color:var(--mute);font-weight:800;margin:22px 4px 10px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:14px;font:inherit;cursor:pointer;min-height:64px;transition:transform .12s,border-color .12s}
.item:active{transform:scale(.98)}.item:hover,.item:focus-visible{border-color:var(--acc);outline:none}
.ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--blob)}
.ic svg{width:22px;height:22px;stroke:var(--icon);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item b{display:block;font-weight:800;font-size:15.5px}
.item small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
.arrow{margin-left:auto;color:var(--mute);font-size:20px}
.note{border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--mute);font-size:14px;margin-top:10px}
nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(536px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1.5px solid var(--line);border-radius:22px;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{border:0;background:none;color:var(--mute);font:700 12px Nunito,sans-serif;border-radius:16px;padding:8px 2px 7px;display:grid;justify-items:center;gap:3px;cursor:pointer;min-height:52px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--navon);color:var(--ink)}
nav button.on::after{content:"";width:16px;height:3px;border-radius:3px;background:var(--acc);margin-top:1px}
.page{display:none}.page.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.bgfx i{animation:none}.page.on{animation:none}.item{transition:none}}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:var(--card);backdrop-filter:blur(12px);border:1.5px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;transition:.2s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{font-size:12px;color:var(--mute);text-align:center;margin-top:14px}
.hide{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-mix" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2.5"/><circle cx="14" cy="18" r="2.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M16 6l3 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0 5 5l-8 8a2.1 2.1 0 0 1-3-3z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</svg>

<div class="bgfx"><i></i><i></i><i></i></div>
<main>
  <section class="page on" id="p-home">
    <div class="top"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--icon)" stroke-width="2"><use href="#i-home"/></svg>Bosh sahifa</h1>
      <button class="theme" id="theme" aria-label="Yorug' / qorong'i rejim">
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button></div>
    <p class="hello" id="hello">Assalomu alaykum!</p>
    <div class="grid">
      <div class="stat"><b id="n-topics">0</b><span>Mavzular</span></div>
      <div class="stat"><b id="n-variants">0</b><span>Variantlar</span></div>
      <div class="stat"><b id="n-checks">0</b><span>Tekshirilgan</span></div>
      <div class="stat"><b id="n-students">0</b><span>O'quvchilar</span></div>
    </div>
    <div class="sec">Tezkor</div>
    <div class="list" data-items="upload,check,vars"></div>
    <p class="demo hide" id="demo">Bu namuna ko'rinish: sonlar va tugmalar Telegram ichida haqiqiy ishlaydi.</p>
  </section>

  <section class="page" id="p-tests">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--icon)" stroke-width="2"><use href="#i-stack"/></svg>Testlar</h1>
    <div class="list" data-items="upload,use,lib,own"></div>
  </section>

  <section class="page" id="p-results">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--icon)" stroke-width="2"><use href="#i-chart"/></svg>Natijalar</h1>
    <div class="list" data-items="check,vars"></div>
    <div class="note">Titul rasmini yuborish uchun <b>Testlarni tekshirish</b>ni bosing — bot rasm kutadi.</div>
  </section>

  <section class="page" id="p-profile">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--icon)" stroke-width="2"><use href="#i-user"/></svg>Profil</h1>
    <p class="hello" id="pname">O'qituvchi</p>
    <div class="list" data-items="students,admin"></div>
  </section>
</main>

<nav>
  <button class="on" data-p="home"><svg><use href="#i-home"/></svg>Bosh</button>
  <button data-p="tests"><svg><use href="#i-stack"/></svg>Testlar</button>
  <button data-p="results"><svg><use href="#i-chart"/></svg>Natijalar</button>
  <button data-p="profile"><svg><use href="#i-user"/></svg>Profil</button>
</nav>
<div class="toast" id="toast"></div>

<script>
{
const ACTIONS = {
  upload:  ["i-up",    "Test yuklash (Word)",     "Har bir o'quvchiga alohida variant va titul"],
  use:     ["i-mix",   "Testdan foydalanish",     "Mavzularni tanlab aralash test tuzish"],
  lib:     ["i-book",  "Tayyor testlar",          "Kitob → bob → test"],
  own:     ["i-key",   "O'z testim",              "Qog'ozdagi test uchun javob kaliti"],
  check:   ["i-check", "Testlarni tekshirish",    "Titul rasmini yuboring — natija chiqadi"],
  vars:    ["i-stack", "Variantlarim",            "Tayyorlangan variantlarni ko'rish va o'chirish"],
  students:["i-users", "O'quvchilar ro'yxati",    "Guruhlar va o'quvchilar"],
  admin:   ["i-tool",  "Admin panel",             "Statistika, foydalanuvchilar, reklama"]
};
const tg = window.Telegram && window.Telegram.WebApp;
// Tugma (KeyboardButton) orqali ochilganda Telegram initData bermaydi - shuning uchun platformaga qaraymiz
const inTg = !!(tg && ((tg.platform && tg.platform !== "unknown") || tg.initData));
const q = new URLSearchParams(location.search);
const isAdmin = q.get("admin") === "1";

const toast = document.getElementById("toast");
let tt;
const say = t => { toast.textContent = t; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 2200); };

for (const box of document.querySelectorAll("[data-items]")) {
  box.innerHTML = box.dataset.items.split(",")
    .filter(k => k !== "admin" || isAdmin || !inTg)
    .map(k => { const [ic, t, d] = ACTIONS[k];
      return `<button class="item" data-a="${k}"><span class="ic"><svg><use href="#${ic}"/></svg></span>` +
             `<span><b>${t}</b><small>${d}</small></span><span class="arrow">›</span></button>`; }).join("");
}

document.addEventListener("click", e => {
  const it = e.target.closest(".item");
  if (it) {
    const a = it.dataset.a;
    if (inTg) {
      try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
      try { tg.sendData(a); } catch (err) { say("Ilovani botdagi «📱 Ilovani ochish» tugmasi orqali oching"); }
    }
    else say(`Telegramda: «${ACTIONS[a][1]}» botda ochiladi`);
    return;
  }
  if (e.target.closest("#theme")) { setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light", true); return; }
  const nb = e.target.closest("nav button");
  if (nb) {
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b === nb));
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + nb.dataset.p));
    window.scrollTo(0, 0);
  }
});

function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  const c = t === "light" ? "#f4f1ff" : "#1f2633";
  if (tg) { try { tg.setHeaderColor && tg.setHeaderColor(c); tg.setBackgroundColor && tg.setBackgroundColor(c); } catch (_) {} }
  if (save) { try { localStorage.setItem("theme", t); } catch (_) {} }
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (_) {}
setTheme(saved || (tg && tg.colorScheme) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

const hasNums = ["topics", "variants", "checks", "students"].some(k => q.has(k));
const sample = { topics: 12, variants: 148, checks: 96, students: 34 };
for (const k of ["topics", "variants", "checks", "students"])
  document.getElementById("n-" + k).textContent = hasNums ? (parseInt(q.get(k)) || 0) : (inTg ? 0 : sample[k]);
if (!inTg) document.getElementById("demo").classList.remove("hide");

if (tg) {
  try {
    tg.ready(); tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      const n = [u.first_name, u.last_name].filter(Boolean).join(" ");
      document.getElementById("hello").textContent = `Assalomu alaykum, ${n}! 👋`;
      document.getElementById("pname").textContent = n + (u.username ? " · @" + u.username : "");
    }
  } catch (_) {}
}
}
</script>
</body>
</html>
